# Netlify build config for the Nourish web app.
# The app lives in nourish/, and is served at this site's domain root, so the
# build must use an empty base path (the default build targets GitHub Pages,
# which serves the app under /Nourish/).

[build]
  base    = "nourish"
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  PUBLIC_BASE_PATH = ""

# Single-page app: every path must return index.html rather than a 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    # Bundle filenames are content-hashed, so they are safe to cache forever.
    Cache-Control = "public, max-age=31536000, immutable"

# Meal analysis functions (photo and text). Path is relative to `base`.
# They need ANTHROPIC_API_KEY set in Site configuration -> Environment variables.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"
